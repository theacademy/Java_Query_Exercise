name: db_query
on:
  push:
    branches: [ "main" ]

permissions:
    contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: "3.8.2"
      - name: Build with Maven
        run: mvn -B package --file demo/pom.xml
   
  update-readme:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
      - name: Update README
        env:
          BADGE_URL: "https://github.com/${{ github.repository }}/actions/workflows/db_query.yaml/badge.svg?branch=main"
        run: |
          if ! grep -qF "$BADGE_URL" README.md; then
            sed -i "1i ### Assignment Status: ![](${BADGE_URL})" README.md
            git add README.md
            git commit -m "Update README"
            git push origin HEAD:main
          fi